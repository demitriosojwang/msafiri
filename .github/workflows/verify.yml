name: Verify Mireli Web
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mireli:ci_placeholder@127.0.0.1:5432/mireli
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
